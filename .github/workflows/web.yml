name: Version web

# À chaque mise à jour de main : export web du jeu (sans threads, compatible
# Safari iPhone et hébergement simple), téléchargeable dans l'onglet Actions,
# puis mise en ligne sur GitHub Pages (Settings > Pages > Source : GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer Godot et les modèles d'export web (en cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web
      - name: Télécharger Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot && rm godot.zip
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q tpl.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' 'templates/version.txt'
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/ && rm tpl.tpz
      - name: Importer le projet
        run: ./godot --headless --path . --editor --quit
      - name: Exporter la version web
        run: |
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
      - name: Archive téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: garage-spotter-web
          path: build/web
      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
