name: Tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
      - name: Importer le projet
        run: ./godot --headless --path . --editor --quit
      - name: Tests de l'économie
        run: ./godot --headless --path . -s tests/run_tests.gd
      - name: Parcours d'un nouveau joueur
        run: ./godot --headless --path . -s tests/test_playthrough.gd -- --fresh
